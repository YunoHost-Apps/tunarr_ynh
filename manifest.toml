#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "tunarr"
name = "Tunarr"
description.en = "Create live TV channels from media"
description.fr = "Créer des chaînes de télévision en direct à partir de médias"

version = "2026.9.2~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "Zlib"
website = "https://tunarr.com/"
admindoc = "https://tunarr.com/"
code = "https://github.com/chrisbenincasa/tunarr"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    rename = "tunarr"
    amd64.url = "https://github.com/chrisbenincasa/tunarr/releases/download/v2026.9.2/tunarr-v2026.9.2-linux-x64.tar.gz"
    amd64.sha256 = "c024bae0f02ceaea916f7090174c405dff1ed19e4b243aea57e996838004ca9b"
    arm64.url = "https://github.com/chrisbenincasa/tunarr/releases/download/v2026.9.2/tunarr-v2026.9.2-linux-arm64.tar.gz"
    arm64.sha256 = "106bd4c3960e46535adf659788795c2ea3df7ae22f36a126546354784d1adaa7"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = ".*\\-linux-x64"
    autoupdate.asset.arm64 = ".*\\-linux-arm64"

    [resources.sources.ffmpeg]
    amd64.url = "https://github.com/orhtej2/ffmpeg-binary/releases/download/n9.0.2/ffmpeg-n9.0.2-linux-amd64.tar.gz"
    amd64.sha256 = "a0a37ce455dd9ace513d45e1237d8cb27309ac0df5cd5e9e5e8a2e55558159ce"
    arm64.url = "https://github.com/orhtej2/ffmpeg-binary/releases/download/n9.0.2/ffmpeg-n9.0.2-linux-arm64.tar.gz"
    arm64.sha256 = "f9d1cb32cb61ba262e94602ce941b1de3b459c056e12de5eef85780b8c67387a"

    autoupdate.strategy = "latest_github_release"
    autoupdate.upstream = "https://github.com/orhtej2/ffmpeg-binary"
    autoupdate.version_regex = "n(\\d+\\.\\d+\\.\\d+)"
    autoupdate.asset.amd64 = ".*linux-amd64\\.tar\\.gz"
    autoupdate.asset.arm64 = ".*linux-arm64\\.tar\\.gz"

    [resources.system_user]

    [resources.install_dir]

    #[resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    

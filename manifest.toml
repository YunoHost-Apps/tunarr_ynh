#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "tunarr"
name = "Tunarr"
description.en = "Create live TV channels from media"
description.fr = "Créer des chaînes de télévision en direct à partir de médias"

version = "2026.11.3~ynh2"

maintainers = ["eric_G"]

[upstream]
license = "Zlib"
website = "https://tunarr.com/"
admindoc = "https://tunarr.com/"
code = "https://github.com/chrisbenincasa/tunarr"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    amd64.url = "https://github.com/chrisbenincasa/tunarr/releases/download/v2026.11.3/tunarr-v2026.11.3-linux-x64.tar.gz"
    amd64.sha256 = "aade2181c6bc72af4758ef4849a02a76be0ac4262f7ecc69e339bd0b8ac757c7"
    arm64.url = "https://github.com/chrisbenincasa/tunarr/releases/download/v2026.11.3/tunarr-v2026.11.3-linux-arm64.tar.gz"
    arm64.sha256 = "374a5dd83cab13e54de2c6a59361bee29fd2662f213579c97c72fd57c6dca8c0"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = ".*\\-linux-x64"
    autoupdate.asset.arm64 = ".*\\-linux-arm64"

    [resources.sources.ffmpeg]
    amd64.url = "https://github.com/orhtej2/ffmpeg-binary/releases/download/n9.1/ffmpeg-n9.1-linux-amd64.tar.gz"
    amd64.sha256 = "ba61ceecf9db4843825aada15f8818d7846343fbb3ac9d00a0b351f36e797d7d"
    arm64.url = "https://github.com/orhtej2/ffmpeg-binary/releases/download/n9.1/ffmpeg-n9.1-linux-arm64.tar.gz"
    arm64.sha256 = "8551d58595276f18b06eed634c91a167c31677bb643e1c306a8355de7bcde309"

    autoupdate.strategy = "latest_github_release"
    autoupdate.upstream = "https://github.com/orhtej2/ffmpeg-binary"
    autoupdate.version_regex = "n(?P<version>\\d+(\\.\\d+)+)"
    autoupdate.asset.amd64 = ".*linux-amd64\\.tar\\.gz"
    autoupdate.asset.arm64 = ".*linux-arm64\\.tar\\.gz"

    [resources.system_user]

    [resources.install_dir]

    #[resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    
